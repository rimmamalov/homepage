<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
    <title>Résumé</title>

  <body>
    <main>
      <div class="resume">
        <div class="container">
          <div class="resume__block">
            <h1 class="contact-info__header">Rimma Malovichko</h1>
            <h3 class="contact-info__sub-header">Junior Developer</h3>

            <div class="contact_info_container fh">
              <div class="contact-info__block">
                <a href="#" rel="author" class="contact-info__item">
                  <span>Your City, Country</span>
                </a>

                <a href="mailto:rmmalovichko@gmail.com" rel="author" class="contact-info__item">
                  <span>rmmalovichko@gmail.com</span>
                </a>
              </div>

              <div class="contact-info__block contact-info__block--center">
                <img
                  class="contact-info__avatar"
                  src="assets/avatar.png"
                  alt="Avatar"
                />
              </div>

              <div class="contact-info__block">
                <a href="https://github.com/rimmamalov" rel="author" class="contact-info__item">
                  <span>GitHub</span>
                </a>

                <a href="https://www.linkedin.com/in/rrimma/" rel="author" class="contact-info__item">
                  <span>LinkedIn</span>
                </a>
              </div>
            </div>
          </div>
        </div>

        <div class="container">
          <div class="resume__block">
            <div class="intro">
              <div class="intro__icon-wrapper"></div>
              <p class="intro_text">
                I am a computer science student interested in web development,
                clean code and building useful digital products. I enjoy learning
                new technologies and improving my practical programming skills.
              </p>
            </div>
          </div>
        </div>
      </div>
